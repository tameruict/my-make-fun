<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearth &amp; Skewer — Nocturnal Street Kitchen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #120f0d;
      color: #f6efe3;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main.kitchen-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #kitchen-canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      background: #120f0d;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.72);
      cursor: pointer;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="kitchen-stage">
    <canvas
      id="kitchen-canvas"
      width="1280"
      height="720"
      aria-label="Hearth and Skewer: nocturnal street kitchen cooking game. Move with WASD or click, interact with Space or E, select pantry crates 1 to 6, rotate charcoal hearth with R, discard with Q."
    ></canvas>
    <div id="kitchen-status" role="status" aria-live="polite" class="sr-only">
      Hearth &amp; Skewer — Nocturnal Street Kitchen. Press Space or click to start shift.
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
