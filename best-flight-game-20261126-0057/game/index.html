<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ridgeline Patrol</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0f18;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #flight-canvas {
        display: block;
        background: #0b3d66;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas
      id="flight-canvas"
      width="1280"
      height="720"
      aria-label="Ridgeline Patrol flight view: the Kestrel K-7 patrol aircraft over a volcanic island archipelago"
    ></canvas>
    <div id="flight-status" class="sr-only" role="status" aria-live="polite">Ridgeline Patrol ready.</div>
    <div id="flight-screen-text" class="sr-only" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
